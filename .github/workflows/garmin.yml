name: Synchronizacja Garmin
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Fetch and encrypt
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
          SYNC_PASSWORD: ${{ secrets.SYNC_PASSWORD }}
        run: python sync_garmin.py
      - name: Commit encrypted payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garmin-data.enc.json
          if ! git diff --cached --quiet; then
            git commit -m "Update encrypted Garmin data"
            git push
          fi
